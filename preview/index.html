    content: "SDRs are dead. We just replaced our entire outbound sales team with autonomous AI voice & email agents.\n\nResults after 60 days:\n• 14,800 accounts touched per week (up 11x)\n• 3.8% positive response rate\n• $410k added to pipeline at 1/10th the cost\n\nIf your company is still paying $80k OTE for junior reps to copy-paste cold emails, you are burning capital on an obsolete model.\n\nThe future of B2B sales is algorithmic. Agree?",
    tags: "#SaaS #ArtificialIntelligence #SalesTech #Outbound", likes: 1842, commentsCount: 428, reposts: 94,

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function allPosts() { return S.customPosts.concat(SEED_POSTS); }
function getPost(id) { var p = null; allPosts().forEach(function (x) { if (x.id === id) p = x; }); return p || SEED_POSTS[0]; }
function anglesFor(id) { return ANGLES[id] || GENERIC_ANGLES; }
function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.className = "toast show"; setTimeout(function () { t.className = "toast"; }, 4000); }
function setScreen(name) { S.screen = name; save(); render(); }
function setTarget(id) { S.targetId = id; save(); }

function feedHTML() {

}
function pillHTML() {

  var cards = "";
  Object.keys(angs).forEach(function (label) {
    cards += '<div class="angle" data-angle="' + esc(label) + '"><div class="row"><b>' + esc(label) + '</b><span>Tap to inject</span></div><p>' + esc(angs[label]) + "</p></div>";
  });
  return '<div class="hud" id="hud"><div class="hhead"><span class="drag">⋮⋮</span>' +
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="#0a66c2"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4z"/></svg>' +

    '<div id="draftArea"></div></div>';

function personaHTML() {
  var presets = PRESETS.map(function (r) {

  }).join("");
  var tones = TONES.map(function (t) {
    return '<div class="tone' + (S.persona.tone === t.id ? " on" : "") + '" data-tone="' + t.id + '"><span class="radio"><i></i></span><span><b>' + t.label + "</b><p>" + t.guide + "</p></span></div>";
  }).join("");
  return '<div class="panel"><div class="phead"><div class="ic">≡</div><div><h3>Voice &amp; Persona</h3><div class="sub">Calibrates FloatReply AI overlay tone</div></div></div>' +
    "<h4>Role &amp; Expertise:</h4>" +
    '<input type="text" id="roleInput" value="' + esc(S.persona.role) + '"><div style="font-size:11px;color:#9ca3af;margin:8px 0 4px;">Quick Presets:</div>' + presets +
    "<h4>Tone of Voice:</h4>" + tones +

    '<textarea id="rulesInput" style="height:90px;">Ban buzzwords like \'game-changer\' and \'delve\'. Cite concrete numbers or trade-offs. Never re-explain what the author wrote.</textarea>' +
    '<div class="switchrow" style="margin-top:16px;"><div><b>Auto-Submit Comment</b><br><span>Directly publishes to LinkedIn after typing</span></div>' +
    '<input type="checkbox" class="switch" id="autoSwitch"' + (S.persona.autoSubmit ? " checked" : "") + "></div>" +
    '<div class="switchrow"><div><b>Sign comments with role</b><br><span>Appends your role under injected comments</span></div>' +

    '<button class="bigbtn" id="applyBtn">Apply &amp; Refresh AI Overlay</button>' +
    '<div class="telebox" style="margin-top:14px;"><div class="thead" id="teleHead"><span>Overlay Telemetry (' + LOGS.length + ")</span><span>Inspect</span></div>" +
    '<div class="logbox">' + LOGS.slice(0, 6).map(function (l) { return '<p class="log' + (l.indexOf("Gemini") >= 0 ? " gem" : "") + '">' + esc(l) + "</p>"; }).join("") + "</div></div></div>";
}
function telemetryHTML() {
  return '<div class="panel"><h3>Overlay Telemetry</h3><p style="font-size:12px;color:#5e5e5e;">' + LOGS.length + " events · newest first</p>" +
    '<div class="loglist" style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:12px;">' +
    LOGS.map(function (l) { return '<p class="log' + (l.indexOf("Gemini") >= 0 ? " gem" : "") + '">' + esc(l) + "</p>"; }).join("") + "</div></div>";

function addpostHTML() {
  return '<div class="modalbg" id="modalbg"><div class="modal"><h3>Paste Custom LinkedIn Post</h3>' +
    "<p>Test FloatReply's floating AI overlay on any post from your actual LinkedIn feed.</p>" +
    "<label>Author Name</label>" + '<input type="text" id="inAuthor" placeholder="e.g. Satya Nadella">' +
    "<label>Author Headline</label>" + '<input type="text" id="inHeadline" placeholder="e.g. Chairman and CEO at Microsoft">' +
    "<label>Post Body Content</label>" + '<textarea id="inContent" placeholder="Paste the LinkedIn post copy here…"></textarea>' +
    '<div class="mrow"><button class="no" id="dlgCancel">Cancel</button><button class="ok" id="dlgAdd">Add to Feed</button></div></div></div>';
}
function appendToScreen(html) {
  var tmp = document.createElement("div");
  tmp.innerHTML = html;
  var scr = document.querySelector(".screen");
  while (tmp.firstChild) scr.appendChild(tmp.firstChild);
}
function render() {
  var vp = document.getElementById("viewport");
  document.querySelectorAll(".screen > .pill, .screen > .hud, .screen > .modalbg").forEach(function (n) { n.remove(); });
  var sw = document.querySelectorAll("#switcher button");
  sw.forEach(function (b) { b.className = b.getAttribute("data-screen") === S.screen ? "on" : ""; });
  document.getElementById("caption").innerHTML = CAPTIONS[S.screen] || "";
  if (S.screen === "feed") { vp.innerHTML = feedHTML(); appendToScreen(pillHTML()); bindFeed(vp); bindPill(); }
  else if (S.screen === "overlay") { vp.innerHTML = feedHTML(); appendToScreen(overlayHTML()); bindFeed(vp); bindOverlay(vp); }
  else if (S.screen === "persona") { vp.innerHTML = personaHTML(); bindPersona(vp); }
  else if (S.screen === "telemetry") { vp.innerHTML = telemetryHTML(); }
  else if (S.screen === "addpost") { vp.innerHTML = feedHTML(); appendToScreen(addpostHTML()); bindFeed(vp); bindDialog(vp); }
  vp.scrollTop = 0;
}
function bindFeed(vp) {
  vp.querySelectorAll("[data-goto]").forEach(function (el) {
    el.addEventListener("click", function (ev) { ev.stopPropagation(); setScreen(el.getAttribute("data-goto")); });
  });
  vp.querySelectorAll("[data-target]").forEach(function (el) {
    el.addEventListener("click", function (ev) { ev.stopPropagation(); setTarget(el.getAttribute("data-target")); toast("Locked: " + getPost(el.getAttribute("data-target")).name); render(); });
  });
  vp.querySelectorAll(".card").forEach(function (card) {
    card.addEventListener("click", function (ev) {
      if (ev.target.closest("button") || ev.target.closest("input") || ev.target.closest(".cbox")) return;
      setTarget(card.getAttribute("data-post-id")); render();
    });
  });
  vp.querySelectorAll("[data-cbox]").forEach(function (btn) {
    btn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      var w = vp.querySelector('[data-cbox-wrap="' + btn.getAttribute("data-cbox") + '"]');
      if (w) w.style.display = w.style.display === "none" ? "flex" : "none";
    });
  });
  vp.querySelectorAll("[data-post]").forEach(function (btn) {
    btn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      var id = btn.getAttribute("data-post");
      var input = vp.querySelector('[data-draft="' + id + '"]');
      var text = input ? input.value.trim() : "";
      if (!text) return;
      S.injected[id] = text; save(); toast("Comment published to LinkedIn feed!"); render();
    });
  });
}
function bindPill() {
  var pill = document.getElementById("pill");
  if (!pill) return;
  var vp = document.getElementById("viewport");
  var scr = document.querySelector(".screen");
  var sx = 0, sy = 0, ox = 0, oy = 0, moved = false;
  pill.addEventListener("pointerdown", function (ev) {
    moved = false; sx = ev.clientX; sy = ev.clientY;
    var r = pill.getBoundingClientRect(); var s = scr.getBoundingClientRect();
    ox = r.left - s.left; oy = r.top - s.top;
    pill.setPointerCapture(ev.pointerId);
  });
  pill.addEventListener("pointermove", function (ev) {
    if (ev.buttons !== 1) return;
    var dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    var s = scr.getBoundingClientRect(); var v = vp.getBoundingClientRect();
    var nx = Math.max(0, Math.min(ox + dx, s.width - pill.offsetWidth - 8));
    var ny = Math.max(30, Math.min(oy + dy, 30 + v.height - pill.offsetHeight - 8));
    pill.style.left = nx + "px"; pill.style.top = ny + "px";
  });
  pill.addEventListener("pointerup", function (ev) {
    if (!moved) { setScreen("overlay"); return; }
    S.pillPos = { x: parseInt(pill.style.left, 10) || 196, y: parseInt(pill.style.top, 10) || 520 };
    var pr = pill.getBoundingClientRect();
    var cx = pr.left + pr.width / 2, cy = pr.top + pr.height / 2;
    var hit = null;
    vp.querySelectorAll(".card").forEach(function (card) {
      var r = card.getBoundingClientRect();
      if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) hit = card.getAttribute("data-post-id");
    });
    if (hit) { setTarget(hit); toast("Locked: " + getPost(hit).name); }
    save(); render();
  });
}
function bindOverlay(vp) {
  var close = document.getElementById("hudClose");
  if (close) close.addEventListener("click", function () { setScreen("feed"); });
  var ref = document.getElementById("refreshBtn");
  if (ref) ref.addEventListener("click", function () { toast("Angles refreshed for " + getPost(S.targetId).name); });
  vp.querySelectorAll(".angle").forEach(function (el) {
    el.addEventListener("click", function () {
      var label = el.getAttribute("data-angle");
      var text = anglesFor(S.targetId)[label] || "";
      var thought = document.getElementById("thoughtInput");
      if (thought && thought.value.trim()) text += " Specifically regarding " + thought.value.trim() + ",";
      if (S.persona.signoff) text += "\n— " + S.persona.role;
      var area = document.getElementById("draftArea");
      area.innerHTML = '<div class="draftbox"><span class="hint">Typing into ' + esc(getPost(S.targetId).name) + '&#39;s comment box…</span><br><span id="typeText"></span></div>' +
        '<div class="btnrow" id="draftBtns" style="display:none;"><button class="primary" id="postInjected">Post comment</button><button class="ghost" id="viewFeed">View in feed</button></div>';
      var i = 0, out = document.getElementById("typeText");
      var timer = setInterval(function () {
        i += 2;
        out.textContent = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(timer);
          document.getElementById("draftBtns").style.display = "flex";
          toast(S.persona.autoSubmit ? "Comment typed! Auto-submitting…" : "Comment injected! Ready to post.");
          if (S.persona.autoSubmit) { finishInject(text); }
        }
      }, 12);
      document.getElementById("postInjected").addEventListener("click", function () { finishInject(text); });
      document.getElementById("viewFeed").addEventListener("click", function () { S.injected[S.targetId] = text; save(); setScreen("feed"); });
    });
  });
  function finishInject(text) {
    S.injected[S.targetId] = text; save();
    toast("Comment published to LinkedIn feed!");
    setScreen("feed");
  }
}
function bindPersona(vp) {
  vp.querySelectorAll("[data-role]").forEach(function (el) {
    el.addEventListener("click", function () {
      S.persona.role = el.getAttribute("data-role");
      var inp = document.getElementById("roleInput"); if (inp) inp.value = S.persona.role;
      save(); render();
    });
  });
  var roleInput = document.getElementById("roleInput");
  if (roleInput) roleInput.addEventListener("change", function () { S.persona.role = roleInput.value; save(); render(); });
  vp.querySelectorAll("[data-tone]").forEach(function (el) {
    el.addEventListener("click", function () { S.persona.tone = el.getAttribute("data-tone"); save(); render(); });
  });
  var a = document.getElementById("autoSwitch");
  if (a) a.addEventListener("change", function () { S.persona.autoSubmit = a.checked; save(); });
  var s = document.getElementById("signSwitch");
  if (s) s.addEventListener("change", function () { S.persona.signoff = s.checked; save(); });
  var ap = document.getElementById("applyBtn");
  if (ap) ap.addEventListener("click", function () { save(); toast("Persona applied — angles refreshed"); setScreen("feed"); });
  var th = document.getElementById("teleHead");
  if (th) th.addEventListener("click", function () { setScreen("telemetry"); });
}
function bindDialog(vp) {
  var cancel = document.getElementById("dlgCancel");
  if (cancel) cancel.addEventListener("click", function () { setScreen("feed"); });
  var bg = document.getElementById("modalbg");
  if (bg) bg.addEventListener("click", function (ev) { if (ev.target === bg) setScreen("feed"); });
  var add = document.getElementById("dlgAdd");
  if (add) add.addEventListener("click", function () {
    var content = document.getElementById("inContent").value.trim();
    if (!content) { toast("Paste the post content first."); return; }
    var author = document.getElementById("inAuthor").value.trim() || "Industry Colleague";
    var headline = document.getElementById("inHeadline").value.trim() || "VP Product & AI Strategy";
    var post = { id: "custom_" + Date.now(), name: author, headline: headline, initials: author.slice(0, 2).toUpperCase(), color: "#4f46e5",
      time: "Just now", degree: "1st", content: content, tags: "#ProductStrategy #Tech #Innovation", likes: 42, commentsCount: 6, reposts: 2,
      sentiment: { badge: "Community Post", theme: "Custom User-Pasted Post", score: 90, engagement: "High", controversy: "Medium" },
      summary: "Discussion on \"" + content.slice(0, 60) + "…\"", comments: [] };
    S.customPosts.unshift(post); S.targetId = post.id; save();
    toast("Custom post added to feed!"); setScreen("feed");
  });
}
document.getElementById("switcher").addEventListener("click", function (ev) {
  var btn = ev.target.closest("button[data-screen]");
  if (btn) setScreen(btn.getAttribute("data-screen"));
});
render();
</script>
